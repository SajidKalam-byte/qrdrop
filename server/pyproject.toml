[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qrdrop-server"
version = "0.1.0"
description = "Zero-account LAN file and text drop: scan a QR code, move anything between phone and laptop."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "aiofiles>=23.2",
    "qrcode>=7.4",
    "psutil>=5.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "httpx>=0.27"]

[project.scripts]
qrdrop = "qrdrop.__main__:main"

[tool.setuptools.packages.find]
include = ["qrdrop*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
